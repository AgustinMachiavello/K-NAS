name: Release ISO

# Builds the ISO. A version tag publishes a release (git tag v0.1 && git push origin v0.1); a manual run keeps it as an artifact.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# To create releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tag must match VERSION
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cat VERSION)
          [ "$GITHUB_REF_NAME" = "v$version" ] || {
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version"
            exit 1
          }

      # Download the Debian ISO and verify it
      - name: Download and verify the latest Debian netinst ISO
        working-directory: os/debian
        env:
          # Debian CD signing key (debian.org/CD/verify)
          DEBIAN_CD_KEY: DF9B9C49EAA9298432589D76DA87E80D6294BE9B
        run: |
          # Latest netinst ISO and signed checksums
          base=https://cdimage.debian.org/debian-cd/current/amd64/iso-cd
          # Checksums and signature
          curl -fsSLO "$base/SHA256SUMS"
          curl -fsSLO "$base/SHA256SUMS.sign"

          # Check the signature
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --keyserver hkps://keyring.debian.org --recv-keys "$DEBIAN_CD_KEY"
          gpg --batch --status-fd 1 --verify SHA256SUMS.sign SHA256SUMS \
            | grep "^\[GNUPG:\] VALIDSIG .* $DEBIAN_CD_KEY\$"

          # Check the ISO
          iso=$(grep -o 'debian-[0-9.]*-amd64-netinst\.iso' SHA256SUMS | head -n 1)
          curl -fsSLO "$base/$iso"
          grep " $iso\$" SHA256SUMS | sha256sum -c -
          # Only the ISO is needed now
          rm SHA256SUMS SHA256SUMS.sign

      # Build the ISO
      - name: Build the auto-installable ISO
        run: ./os/debian/build-iso.sh

      # Checksum for users
      - name: Checksum
        working-directory: os/debian
        run: sha256sum debian-auto-installable.iso > debian-auto-installable.iso.sha256

      # Tag: attach to the release
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            os/debian/debian-auto-installable.iso
            os/debian/debian-auto-installable.iso.sha256

      # Manual run: keep as artifact
      - name: Keep the ISO as a build artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: debian-auto-installable
          path: os/debian/debian-auto-installable.iso
