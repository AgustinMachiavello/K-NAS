# Dockge: manage the apps in /opt/stacks. Controls Docker: keep it off the internet.
services:
  dockge:
    container_name: dockge
    image: louislam/dockge:1
    ports:
      - "5001:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      # Same path inside and out (required)
      - /opt/stacks:/opt/stacks
    environment:
      DOCKGE_STACKS_DIR: /opt/stacks
    restart: unless-stopped
