# K-NAS Debian install.

# ======================================================
# EDIT THESE VALUES FOR YOUR OWN SETUP
# Delete a line to make the installer ask for it instead.
# ======================================================

# Machine name on the network
d-i netcfg/get_hostname string k-nas

# Normal user: display name
d-i passwd/user-fullname string K-NAS

# The login name and password are NOT set here: the installer asks for them, so no
# default password ever exists. K-NAS checks the password again after the install.

# ======================================================
# DEFAULTS, NO NEED TO EDIT
# ======================================================

# Use the first network interface automatically
d-i netcfg/choose_interface select auto

# Leave the domain name empty
d-i netcfg/get_domain string

# Choose the package mirror manually
d-i mirror/country string manual

# Mirror server
d-i mirror/http/hostname string deb.debian.org

# Folder on the mirror where Debian lives
d-i mirror/http/directory string /debian

# No HTTP proxy
d-i mirror/http/proxy string

# Disable the root account (the normal user gets sudo automatically)
d-i passwd/root-login boolean false

# Hardware clock uses UTC
d-i clock-setup/utc boolean true

# Simple partitioning, no LVM
d-i partman-auto/method string regular

# Use a single partition for everything
d-i partman-auto/choose_recipe select atomic

# Confirm creating a new partition table on a blank disk
d-i partman/confirm_write_new_label boolean true

# Finish partitioning without asking (the final "write changes?" question is still asked)
d-i partman/choose_partition select finish

# Software to install: SSH server and standard utilities, no desktop
tasksel tasksel/first multiselect ssh-server, standard

# Extra packages: avahi-daemon lets you reach the NAS as <hostname>.local (k-nas.local)
d-i pkgsel/include string avahi-daemon

# Do not send anonymous usage stats
popularity-contest popularity-contest/participate boolean false

# Install the GRUB bootloader
d-i grub-installer/only_debian boolean true

# Put GRUB on the same disk the system was installed on
d-i grub-installer/bootdev string default

# After the install: copy K-NAS to the new system and set up the login welcome screen
d-i preseed/late_command string sh /cdrom/k-nas/late-command.sh

# Reboot when done without waiting for a keypress
d-i finish-install/reboot_in_progress note