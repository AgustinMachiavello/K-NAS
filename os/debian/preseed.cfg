# K-NAS Debian install.

# Your settings (delete a line to be asked instead)

# Machine name
d-i netcfg/get_hostname string k-nas

# User display name
d-i passwd/user-fullname string K-NAS

# Login name and password are asked at install: no default password

# Defaults

# First network interface
d-i netcfg/choose_interface select auto

# No domain
d-i netcfg/get_domain string

# Manual mirror
d-i mirror/country string manual

# Mirror host
d-i mirror/http/hostname string deb.debian.org

# Mirror folder
d-i mirror/http/directory string /debian

# No HTTP proxy
d-i mirror/http/proxy string

# No root login (the user gets sudo)
d-i passwd/root-login boolean false

# Clock in UTC
d-i clock-setup/utc boolean true

# Plain partitions, no LVM
d-i partman-auto/method string regular

# One partition
d-i partman-auto/choose_recipe select atomic

# New partition table on a blank disk
d-i partman/confirm_write_new_label boolean true

# Finish partitioning (the final "write changes?" is still asked)
d-i partman/choose_partition select finish

# SSH server + standard tools, no desktop
tasksel tasksel/first multiselect ssh-server, standard

# No usage stats
popularity-contest popularity-contest/participate boolean false

# GRUB
d-i grub-installer/only_debian boolean true

# GRUB on the system disk
d-i grub-installer/bootdev string default

# After install: set up K-NAS
d-i preseed/late_command string sh /cdrom/k-nas/os/debian/late-command.sh

# Reboot without waiting
d-i finish-install/reboot_in_progress note