APP_NAME="Immich"
APP_DESCRIPTION="Photos and videos from all your devices"
APP_PORT=2283
APP_DIRS="library postgres model-cache"
APP_SECRETS="DB_PASSWORD"
# Database container and user
APP_DUMP_CONTAINER="immich_postgres"
